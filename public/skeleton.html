<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skeleton Loading Screen</title>
  <style>
    /* ==========================================================================
       CSS CUSTOM PROPERTIES & THEMING
       ========================================================================== */
    :root {
      --bg-page: #0a0a0a;
      --card-bg: #121212;
      --card-border: rgba(255, 255, 255, 0.06);
      --separator-color: rgba(255, 255, 255, 0.06);

      /* Skeleton Theme Variables */
      --skeleton-base: #1a1a1a;
      --skeleton-speed: 1.8s;
      --skeleton-radius: 8px;
      --skeleton-radius-circle: 50%;
      --skeleton-shimmer: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.04) 25%,
        rgba(255, 255, 255, 0.08) 50%,
        rgba(255, 255, 255, 0.04) 75%,
        transparent 100%
      );
    }

    /* Optional Light Theme Override
    [data-theme="light"] {
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.06);
      --separator-color: rgba(0, 0, 0, 0.06);
      --skeleton-base: #e2e8f0;
      --skeleton-shimmer: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 25%,
        rgba(255, 255, 255, 0.7) 50%,
        rgba(255, 255, 255, 0.4) 75%,
        transparent 100%
      );
    }
    */

    /* ==========================================================================
       RESET & BASE LAYOUT
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ==========================================================================
       SKELETON CORE & SHIMMER ANIMATION
       ========================================================================== */
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .skeleton {
      position: relative;
      background-color: var(--skeleton-base);
      border-radius: var(--skeleton-radius);
      border: none;
      overflow: hidden;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--skeleton-shimmer);
      background-size: 200% 100%;
      background-repeat: no-repeat;
      animation: shimmer var(--skeleton-speed) ease-in-out infinite;
      pointer-events: none;
    }

    /* Modifiers */
    .skeleton--circle {
      border-radius: var(--skeleton-radius-circle);
      flex-shrink: 0;
    }

    .skeleton--text {
      height: 14px;
      border-radius: var(--skeleton-radius);
    }

    .skeleton--text-sm {
      height: 11px;
      border-radius: var(--skeleton-radius);
    }

    .skeleton--image {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--skeleton-radius);
    }

    /* ==========================================================================
       PATTERN 1: PROFILE HEADER
       ========================================================================== */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }

    .profile-header__avatar {
      width: 56px;
      height: 56px;
    }

    .profile-header__content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .profile-header__name {
      width: 40%;
    }

    .profile-header__bio {
      width: 65%;
    }

    /* ==========================================================================
       PATTERN 2: CARD GRID
       ========================================================================== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 640px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card__text-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card__line--full {
      width: 100%;
    }

    .card__line--eighty {
      width: 80%;
    }

    .card__line--fifty {
      width: 50%;
    }

    /* ==========================================================================
       PATTERN 3: CONTENT LIST
       ========================================================================== */
    .content-list {
      display: flex;
      flex-direction: column;
    }

    .content-list__row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--separator-color);
    }

    .content-list__row:last-child {
      border-bottom: none;
    }

    .content-list__avatar {
      width: 40px;
      height: 40px;
    }

    .content-list__content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .content-list__title {
      width: 55%;
    }

    .content-list__subtitle {
      width: 35%;
    }

    /* ==========================================================================
       ACCESSIBILITY
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      .skeleton::after {
        animation: none;
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Skeleton loading container with accessible live/busy announcements -->
  <main class="container" aria-busy="true" aria-live="polite">

    <!-- 1. PROFILE HEADER -->
    <section class="profile-header">
      <div class="skeleton skeleton--circle profile-header__avatar" aria-hidden="true"></div>
      <div class="profile-header__content">
        <div class="skeleton skeleton--text profile-header__name" aria-hidden="true"></div>
        <div class="skeleton skeleton--text-sm profile-header__bio" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 2. CARD GRID (3-column responsive) -->
    <section class="card-grid">
      <!-- Card 1 -->
      <article class="card">
        <div class="skeleton skeleton--image" aria-hidden="true"></div>
        <div class="card__text-group">
          <div class="skeleton skeleton--text card__line--full" aria-hidden="true"></div>
          <div class="skeleton skeleton--text card__line--eighty" aria-hidden="true"></div>
          <div class="skeleton skeleton--text card__line--fifty" aria-hidden="true"></div>
        </div>
      </article>

      <!-- Card 2 -->
      <article class="card">
        <div class="skeleton skeleton--image" aria-hidden="true"></div>
        <div class="card__text-group">
          <div class="skeleton skeleton--text card__line--full" aria-hidden="true"></div>
          <div class="skeleton skeleton--text card__line--eighty" aria-hidden="true"></div>
          <div class="skeleton skeleton--text card__line--fifty" aria-hidden="true"></div>
        </div>
      </article>

      <!-- Card 3 -->
      <article class="card">
        <div class="skeleton skeleton--image" aria-hidden="true"></div>
        <div class="card__text-group">
          <div class="skeleton skeleton--text card__line--full" aria-hidden="true"></div>
          <div class="skeleton skeleton--text card__line--eighty" aria-hidden="true"></div>
          <div class="skeleton skeleton--text card__line--fifty" aria-hidden="true"></div>
        </div>
      </article>
    </section>

    <!-- 3. CONTENT LIST (4 rows) -->
    <section class="content-list">
      <!-- Row 1 -->
      <div class="content-list__row">
        <div class="skeleton skeleton--circle content-list__avatar" aria-hidden="true"></div>
        <div class="content-list__content">
          <div class="skeleton skeleton--text content-list__title" aria-hidden="true"></div>
          <div class="skeleton skeleton--text-sm content-list__subtitle" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="content-list__row">
        <div class="skeleton skeleton--circle content-list__avatar" aria-hidden="true"></div>
        <div class="content-list__content">
          <div class="skeleton skeleton--text content-list__title" aria-hidden="true"></div>
          <div class="skeleton skeleton--text-sm content-list__subtitle" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Row 3 -->
      <div class="content-list__row">
        <div class="skeleton skeleton--circle content-list__avatar" aria-hidden="true"></div>
        <div class="content-list__content">
          <div class="skeleton skeleton--text content-list__title" aria-hidden="true"></div>
          <div class="skeleton skeleton--text-sm content-list__subtitle" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Row 4 -->
      <div class="content-list__row">
        <div class="skeleton skeleton--circle content-list__avatar" aria-hidden="true"></div>
        <div class="content-list__content">
          <div class="skeleton skeleton--text content-list__title" aria-hidden="true"></div>
          <div class="skeleton skeleton--text-sm content-list__subtitle" aria-hidden="true"></div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
